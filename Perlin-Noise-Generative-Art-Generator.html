<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perlin Noise Flow Field — Case File</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050810;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    padding: 20px;
  }
  .dt-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 24px;
    background: #070b14;
    border-radius: 4px;
    color: #a3b3c9;
    max-width: 760px;
    width: 100%;
    border: 1px solid #1a2744;
    box-shadow: inset 0 0 60px rgba(0,0,0,0.6), 0 0 40px rgba(10,20,40,0.4);
    position: relative;
    overflow: hidden;
  }
  .dt-container::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(20,40,70,0.03) 2px,
      rgba(20,40,70,0.03) 4px
    );
    pointer-events: none;
    z-index: 0;
  }
  .dt-header {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    z-index: 1;
  }
  .dt-badge {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #3b82f6;
    border: 1px solid #1e3a5f;
    padding: 2px 10px;
    background: rgba(30,58,95,0.2);
  }
  .dt-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    color: #e2e8f0;
    letter-spacing: 1px;
    flex: 1;
  }
  .dt-case-no {
    font-size: 10px;
    color: #475569;
    letter-spacing: 1px;
  }
  .dt-canvas-wrap {
    position: relative;
    border-radius: 2px;
    overflow: hidden;
    border: 1px solid #1e3a5f;
    box-shadow: 0 0 30px rgba(30,58,95,0.15), inset 0 0 20px rgba(0,0,0,0.5);
    z-index: 1;
    width: 100%;
  }
  .dt-canvas-wrap::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    box-shadow: inset 0 0 80px rgba(5,10,20,0.7);
    pointer-events: none;
    z-index: 2;
  }
  canvas {
    display: block;
    background: #050810;
    width: 100%;
    height: auto;
  }
  .dt-palette {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    z-index: 1;
  }
  .dt-swatch {
    width: 32px;
    height: 32px;
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid #1e3a5f;
    transition: all 0.2s;
    position: relative;
  }
  .dt-swatch:hover { transform: translateY(-2px); border-color: #3b82f6; }
  .dt-swatch.active { border-color: #60a5fa; box-shadow: 0 0 8px rgba(96,165,250,0.3); }
  .dt-controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    z-index: 1;
    background: rgba(10,16,30,0.6);
    padding: 16px;
    border: 1px solid #1a2744;
    border-radius: 2px;
  }
  .dt-control {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .dt-control label {
    font-size: 10px;
    color: #64748b;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .dt-control input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 3px;
    background: #1e3a5f;
    border-radius: 0;
    outline: none;
  }
  .dt-control input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 12px;
    height: 12px;
    background: #3b82f6;
    border: 2px solid #0a1628;
    cursor: pointer;
    border-radius: 0;
    box-shadow: 0 0 6px rgba(59,130,246,0.4);
  }
  .dt-control input[type="range"]::-moz-range-thumb {
    width: 12px;
    height: 12px;
    background: #3b82f6;
    border: 2px solid #0a1628;
    cursor: pointer;
    border-radius: 0;
    box-shadow: 0 0 6px rgba(59,130,246,0.4);
  }
  .dt-val {
    color: #60a5fa;
    font-weight: 700;
  }
  .dt-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 1;
  }
  .dt-btn {
    padding: 8px 20px;
    border: 1px solid #1e3a5f;
    border-radius: 0;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s;
    background: rgba(15,25,45,0.8);
    color: #94a3b8;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .dt-btn:hover {
    background: rgba(30,58,95,0.4);
    color: #e2e8f0;
    border-color: #3b82f6;
    box-shadow: 0 0 12px rgba(59,130,246,0.15);
  }
  .dt-btn.primary {
    background: rgba(59,130,246,0.12);
    color: #60a5fa;
    border-color: #3b82f6;
  }
  .dt-btn.primary:hover {
    background: rgba(59,130,246,0.25);
    box-shadow: 0 0 16px rgba(59,130,246,0.2);
  }
  .dt-footer {
    font-size: 10px;
    color: #475569;
    text-align: center;
    letter-spacing: 1px;
    z-index: 1;
    border-top: 1px solid #1a2744;
    padding-top: 12px;
    width: 100%;
  }
  .dt-divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, #1e3a5f, transparent);
    z-index: 1;
  }
  @media (max-width: 600px) {
    .dt-controls { grid-template-columns: 1fr 1fr; }
    .dt-title { font-size: 16px; }
    body { padding: 10px; }
    .dt-container { padding: 16px; }
  }
</style>
</head>
<body>

<div class="dt-container">
  <div class="dt-header">
    <span class="dt-badge">Case File</span>
    <span class="dt-title">Perlin Noise Flow Field</span>
    <span class="dt-case-no">NO. ████-2026</span>
  </div>

  <div class="dt-divider"></div>

  <div class="dt-canvas-wrap">
    <canvas id="dtCanvas" width="700" height="420"></canvas>
  </div>

  <div class="dt-palette" id="dtPalette"></div>

  <div class="dt-controls">
    <div class="dt-control">
      <label>粒子数量 / Particles</label>
      <input type="range" id="particles" min="200" max="3000" value="1200" step="100">
      <span style="font-size:10px;color:#475569;">当前: <span class="dt-val" id="val-particles">1200</span></span>
    </div>
    <div class="dt-control">
      <label>噪声尺度 / Scale</label>
      <input type="range" id="scale" min="5" max="50" value="15" step="1">
      <span style="font-size:10px;color:#475569;">当前: <span class="dt-val" id="val-scale">15</span></span>
    </div>
    <div class="dt-control">
      <label>流动速度 / Speed</label>
      <input type="range" id="speed" min="0.5" max="5" value="2" step="0.5">
      <span style="font-size:10px;color:#475569;">当前: <span class="dt-val" id="val-speed">2</span></span>
    </div>
    <div class="dt-control">
      <label>时间演化 / Time</label>
      <input type="range" id="timeSpeed" min="0" max="1" value="0.3" step="0.05">
      <span style="font-size:10px;color:#475569;">当前: <span class="dt-val" id="val-time">0.3</span></span>
    </div>
    <div class="dt-control">
      <label>粒子大小 / Size</label>
      <input type="range" id="pSize" min="0.5" max="3" value="1.2" step="0.1">
      <span style="font-size:10px;color:#475569;">当前: <span class="dt-val" id="val-size">1.2</span></span>
    </div>
    <div class="dt-control">
      <label>透明度 / Alpha</label>
      <input type="range" id="alpha" min="0.05" max="0.6" value="0.25" step="0.05">
      <span style="font-size:10px;color:#475569;">当前: <span class="dt-val" id="val-alpha">0.25</span></span>
    </div>
  </div>

  <div class="dt-buttons">
    <button class="dt-btn primary" id="btnPlay">■ 暂停</button>
    <button class="dt-btn" id="btnReset">↻ 重置</button>
    <button class="dt-btn" id="btnClear">⌫ 清空</button>
    <button class="dt-btn" id="btnSave">◫ 存档</button>
  </div>

  <div class="dt-footer">
    柏林噪声流场 · 追踪无形力场中的粒子轨迹 · 鼠标拖拽扰动现场
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('dtCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const PERLIN_YWRAPB = 4, PERLIN_YWRAP = 1 << PERLIN_YWRAPB;
  const PERLIN_ZWRAPB = 8, PERLIN_ZWRAP = 1 << PERLIN_ZWRAPB;
  const PERLIN_SIZE = 4095;
  const perlin = new Float32Array(PERLIN_SIZE + 1);
  for (let i = 0; i <= PERLIN_SIZE; i++) perlin[i] = Math.random();

  function noise(x, y, z) {
    let xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
    let xf = x - xi, yf = y - yi, zf = z - zi;
    let r = 0, ampl = 0.5;
    for (let o = 0; o < 4; o++) {
      let of = xi + (yi << PERLIN_YWRAPB) + (zi << PERLIN_ZWRAPB);
      let rxf = 0.5 * (1.0 - Math.cos(xf * Math.PI));
      let ryf = 0.5 * (1.0 - Math.cos(yf * Math.PI));
      let n1 = perlin[of & PERLIN_SIZE];
      n1 += rxf * (perlin[(of + 1) & PERLIN_SIZE] - n1);
      let n2 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
      n2 += rxf * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n2);
      n1 += ryf * (n2 - n1);
      of += PERLIN_ZWRAP;
      n2 = perlin[of & PERLIN_SIZE];
      n2 += rxf * (perlin[(of + 1) & PERLIN_SIZE] - n2);
      let n3 = perlin[(of + PERLIN_YWRAP) & PERLIN_SIZE];
      n3 += rxf * (perlin[(of + PERLIN_YWRAP + 1) & PERLIN_SIZE] - n3);
      n2 += ryf * (n3 - n2);
      n1 += 0.5 * (1.0 - Math.cos(zf * Math.PI)) * (n2 - n1);
      r += n1 * ampl;
      ampl *= 0.5;
      xi <<= 1; xf *= 2; yi <<= 1; yf *= 2; zi <<= 1; zf *= 2;
      if (xf >= 1.0) { xi++; xf--; }
      if (yf >= 1.0) { yi++; yf--; }
      if (zf >= 1.0) { zi++; zf--; }
    }
    return r;
  }

  const palettes = [
    { name: '午夜档案', bg: '#050810', colors: ['#3b82f6','#60a5fa','#93c5fd','#1e40af','#64748b'] },
    { name: '雨夜霓虹', bg: '#080c14', colors: ['#22d3ee','#38bdf8','#818cf8','#c084fc','#f472b6'] },
    { name: '黑白胶片', bg: '#0a0a0a', colors: ['#f1f5f9','#cbd5e1','#94a3b8','#64748b','#334155'] },
    { name: '迷雾蓝调', bg: '#061018', colors: ['#bfdbfe','#93c5fd','#60a5fa','#3b82f6','#1d4ed8'] },
    { name: '血迹线索', bg: '#0c0408', colors: ['#ef4444','#f87171','#fca5a5','#3b82f6','#1e3a5f'] },
    { name: '冷钢',     bg: '#080a0e', colors: ['#e2e8f0','#94a3b8','#64748b','#475569','#3b82f6'] },
  ];
  let activePalette = 0;

  const paletteEl = document.getElementById('dtPalette');
  palettes.forEach((p, i) => {
    const sw = document.createElement('div');
    sw.className = 'dt-swatch' + (i === 0 ? ' active' : '');
    sw.style.background = `linear-gradient(135deg, ${p.colors[0]}, ${p.colors[2]})`;
    sw.title = p.name;
    sw.onclick = () => {
      activePalette = i;
      document.querySelectorAll('.dt-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
    };
    paletteEl.appendChild(sw);
  });

  class Particle {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * W;
      this.y = Math.random() * H;
      this.vx = 0; this.vy = 0;
      this.colorIdx = Math.floor(Math.random() * palettes[activePalette].colors.length);
      this.life = Math.random() * 100 + 50;
      this.maxLife = this.life;
    }
    update(scale, speed, timeSpeed, time) {
      const n = noise(this.x * scale * 0.001, this.y * scale * 0.001, time * timeSpeed * 0.3);
      const angle = n * Math.PI * 4;
      this.vx += Math.cos(angle) * 0.3 * speed;
      this.vy += Math.sin(angle) * 0.3 * speed;
      this.vx *= 0.92; this.vy *= 0.92;
      this.x += this.vx; this.y += this.vy;
      this.life--;
      if (this.x < 0) this.x = W;
      if (this.x > W) this.x = 0;
      if (this.y < 0) this.y = H;
      if (this.y > H) this.y = 0;
      if (this.life <= 0) this.reset();
    }
    draw(ctx, size, alpha) {
      const pal = palettes[activePalette];
      const lifeRatio = this.life / this.maxLife;
      const color = pal.colors[this.colorIdx];
      ctx.globalAlpha = alpha * lifeRatio;
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, size * (0.5 + lifeRatio * 0.5), 0, Math.PI * 2);
      ctx.fill();
      if (Math.abs(this.vx) > 0.1 || Math.abs(this.vy) > 0.1) {
        ctx.strokeStyle = color;
        ctx.lineWidth = size * 0.5;
        ctx.beginPath();
        ctx.moveTo(this.x - this.vx * 3, this.y - this.vy * 3);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
  }

  let particles = [], time = 0, running = true;
  let mouseX = -1000, mouseY = -1000, mouseActive = false;

  function initParticles(count) {
    particles = [];
    for (let i = 0; i < count; i++) particles.push(new Particle());
  }

  const controls = {
    particles: document.getElementById('particles'),
    scale: document.getElementById('scale'),
    speed: document.getElementById('speed'),
    timeSpeed: document.getElementById('timeSpeed'),
    pSize: document.getElementById('pSize'),
    alpha: document.getElementById('alpha'),
  };

  function updateLabels() {
    document.getElementById('val-particles').textContent = controls.particles.value;
    document.getElementById('val-scale').textContent = controls.scale.value;
    document.getElementById('val-speed').textContent = controls.speed.value;
    document.getElementById('val-time').textContent = controls.timeSpeed.value;
    document.getElementById('val-size').textContent = controls.pSize.value;
    document.getElementById('val-alpha').textContent = controls.alpha.value;
  }

  Object.values(controls).forEach(el => el.addEventListener('input', updateLabels));
  controls.particles.addEventListener('change', () => {
    const diff = parseInt(controls.particles.value) - particles.length;
    if (diff > 0) { for (let i = 0; i < diff; i++) particles.push(new Particle()); }
    else { particles.splice(0, -diff); }
  });

  document.getElementById('btnPlay').onclick = function() {
    running = !running;
    this.textContent = running ? '■ 暂停' : '▶ 播放';
    if (running) loop();
  };
  document.getElementById('btnReset').onclick = function() {
    ctx.fillStyle = palettes[activePalette].bg;
    ctx.fillRect(0, 0, W, H);
    time = Math.random() * 1000;
    particles.forEach(p => p.reset());
  };
  document.getElementById('btnClear').onclick = function() {
    ctx.fillStyle = palettes[activePalette].bg;
    ctx.fillRect(0, 0, W, H);
  };
  document.getElementById('btnSave').onclick = function() {
    const link = document.createElement('a');
    link.download = 'case-evidence-' + Date.now() + '.png';
    link.href = canvas.toDataURL();
    link.click();
  };

  canvas.addEventListener('mousedown', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top; mouseActive = true;
  });
  canvas.addEventListener('mousemove', e => {
    if (!mouseActive) return;
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left; mouseY = e.clientY - rect.top;
  });
  canvas.addEventListener('mouseup', () => mouseActive = false);
  canvas.addEventListener('mouseleave', () => mouseActive = false);

  function loop() {
    if (!running) return;
    const scale = parseFloat(controls.scale.value);
    const speed = parseFloat(controls.speed.value);
    const timeSpeed = parseFloat(controls.timeSpeed.value);
    const pSize = parseFloat(controls.pSize.value);
    const alpha = parseFloat(controls.alpha.value);
    const pal = palettes[activePalette];

    ctx.fillStyle = pal.bg + '0a';
    ctx.fillRect(0, 0, W, H);
    time += 0.01;

    if (mouseActive) {
      ctx.beginPath();
      ctx.arc(mouseX, mouseY, 40, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(96,165,250,0.12)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    for (let p of particles) {
      if (mouseActive) {
        const dx = p.x - mouseX, dy = p.y - mouseY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 80 && dist > 0) {
          const force = (80 - dist) / 80 * 2;
          p.vx += (dx / dist) * force;
          p.vy += (dy / dist) * force;
        }
      }
      p.update(scale, speed, timeSpeed, time);
      p.draw(ctx, pSize, alpha);
    }
    requestAnimationFrame(loop);
  }

  ctx.fillStyle = palettes[0].bg;
  ctx.fillRect(0, 0, W, H);
  initParticles(1200);
  updateLabels();
  loop();
})();
</script>

</body>
</html>
